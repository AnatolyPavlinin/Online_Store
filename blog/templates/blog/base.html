<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=description, initial-scale=1">
    <title>{% block title %}Мой блог{% endblock %}</title>
    {% load static %}
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
</head>
<body>
    <header class="bg-light py-3">
        <div class="container">
            <div class="row">
                <div class="col-md-6">
                    <h1><a href="{% url 'blog:post_list' %}">Мой блог</a></h1>
                </div>
                <div class="col-md-6 text-end">
                    <a href="{% url 'blog:post_create' %}" class="btn btn-primary">Новая запись</a>
                </div>
            </div>
        </div>
    </header>

    <main class="container py-5">
        {% block content %}{% endblock %}
    </main>

    <footer class="py-3 text-center">
        <small>&copy; 2026{{ now|date:"Y" }}</small>
    </footer>

    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
