{% extends "catalog/base.html" %}

{% block title %}Удаление товара{% endblock %}

{% block content %}
<div class="container my-4">
    <h1>Удаление товара</h1>
    <p>Вы уверены, что хотите удалить "<strong>{{ object.name }}</strong>"?</p>

    <form method="post">
        {% csrf_token %}
        <div class="d-grid gap-2">
            <button type="submit" class="btn btn-danger">Да, удалить</button>
            <a href="{% url 'catalog:home' %}" class="btn btn-secondary">Отмена</a>
        </div>
    </form>
</div>
{% endblock %}
